[project]
name = "luau-lens"
version = "2.0.0"
description = "Luau diagnostics for AI coding agents. CLI-first, harness-agnostic: checks, linting, and formatting that agents can run without an LLM turn."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
luau-lens = "luau_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luau_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
